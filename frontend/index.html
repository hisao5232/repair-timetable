<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair-Time: 出張修理予約</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <style>
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #333; color: white; padding: 10px 20px; border-radius: 4px; margin-bottom: 20px; }
        .logout-btn { background: #d9534f; color: white; text-decoration: none; padding: 5px 15px; border-radius: 4px; font-size: 0.9em; cursor: pointer; border: none; }
        .admin-badge { background: #f0ad4e; color: #333; padding: 2px 8px; border-radius: 10px; font-size: 0.7em; vertical-align: middle; margin-left: 5px; display: none; }
        
        /* モーダル内の入力欄調整 */
        .modal-field-group { margin-bottom: 12px; }
        .modal-field-group label { display: block; font-size: 0.8em; color: #666; margin-bottom: 2px; }
        .modal-field-group input, .modal-field-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .search-container { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #dee2e6; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
        .checkbox-group label { background: #fff; border: 1px solid #ddd; padding: 5px 10px; border-radius: 20px; font-size: 0.85em; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .checkbox-group input { width: auto; }

        #status-modal { max-height: 90vh; overflow-y: auto; }

        /* 必須項目のハイライト */
        #customer_name, #machine_model, #appointment_date {
            border-left: 5px solid #ff5252;
            background-color: #fffafa;
        }
        #customer_name::placeholder, #machine_model::placeholder {
            color: #ffcccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-bar">
            <div>
                👤 ログイン中 : <strong id="display-user">読み込み中...</strong>
                <span id="admin-badge" class="admin-badge">管理者</span>
                <a href="./history.html" style="margin-left: 15px; color: #add8e6; text-decoration: none; font-size: 0.9em;">🔍 履歴検索</a>
                <a href="./analysis.html" style="margin-left: 15px; color: #98fb98; text-decoration: none; font-size: 0.9em;">📊 故障原因分析</a>
            </div>
            <button onclick="handleLogout()" class="logout-btn">ログアウト</button>
        </header>

        <section class="input-section">
            <h2>🛠️ 新規予約登録</h2>
            <form id="reservation-form">
                <div class="form-group">
                    <input type="text" id="customer_name" placeholder="顧客名 (必須)" required>
                    <input type="text" id="contact_person" placeholder="先方担当者">
                    <input type="text" id="phone_number" placeholder="連絡先">
                </div>
                <div class="form-group">
                    <input type="text" id="received_by" placeholder="受付担当者名">
                    <label style="font-size: 0.9em; cursor: pointer;">
                        <input type="checkbox" id="is_own_lease" onchange="toggleLeaseLocation('new')"> 自社リース機
                    </label>
                    <select id="lease_location" style="display: none; padding: 5px; border-radius: 4px;">
                        <option value="">拠点を選択</option>
                        <option value="町田">町田</option>
                        <option value="厚木">厚木</option>
                        <option value="相模原">相模原</option>
                        <option value="大和">大和</option>
                        <option value="工場">工場</option>
                        <option value="双葉">双葉</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" id="machine_model" placeholder="型式 (必須)" required>
                    <input type="text" id="serial_number" placeholder="シリアル or 機番">
                    <div style="display: flex; flex-direction: column; gap: 5px;">
                        <input type="datetime-local" id="appointment_date" required>
                        <label style="font-size: 0.8em; color: #666; cursor: pointer;">
                            <input type="checkbox" id="no_time_specified"> 時間指定なし
                        </label>
                    </div>
                </div>
                <input type="text" id="location" placeholder="現場住所" style="width: 100%; margin-bottom: 10px;">
                <textarea id="failure_symptoms" placeholder="故障症状・メモ"></textarea>
                <button type="submit">予約を登録する</button>
            </form>
        </section>

        <hr>

        <section class="timetable-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 id="calendar-month-title">📅 スケジュール</h2>
                <div>
                    <button onclick="changeMonth(-1)" style="padding: 5px 15px; cursor: pointer;">◀ 前の月</button>
                    <button onclick="changeMonth(0)" style="padding: 5px 15px; cursor: pointer;">今月</button>
                    <button onclick="changeMonth(1)" style="padding: 5px 15px; cursor: pointer;">次の月 ▶</button>
                </div>
            </div>
            <div class="timetable-grid"></div>
        </section>

        <div id="status-modal" style="display:none; background: #fff; border: 1px solid #000; padding: 20px; position: fixed; top: 5%; left: 50%; transform: translateX(-50%); z-index: 1000; box-shadow: 0 4px 25px rgba(0,0,0,0.4); border-radius: 8px; width: 95%; max-width: 480px;">
            <h3 style="margin-top:0;">📝 予定の詳細・修正</h3>
            <input type="hidden" id="modal-app-id">
            
            <div class="modal-grid">
                <div class="modal-field-group">
                    <label>顧客名</label>
                    <input type="text" id="edit_customer_name">
                </div>
                <div class="modal-field-group">
                    <label>担当者</label>
                    <input type="text" id="edit_contact_person">
                </div>
                <div class="modal-field-group">
                    <label>連絡先</label>
                    <input type="text" id="edit_phone_number">
                </div>
                <div class="modal-field-group">
                    <label>日時</label>
                    <input type="datetime-local" id="edit_appointment_date">
                    <label style="font-size: 0.8em; color: #666; cursor: pointer; display: block; margin-top: 4px;">
                        <input type="checkbox" id="edit_no_time_specified"> 時間指定なし
                    </label>
                </div>
                <div class="modal-field-group">
                    <label>受付担当</label>
                    <input type="text" id="edit_received_by">
                </div>
                <div class="modal-field-group">
                    <label style="cursor: pointer;">
                        <input type="checkbox" id="edit_is_own_lease" onchange="toggleLeaseLocation('edit')"> 自社リース機
                    </label>
                    <select id="edit_lease_location" style="display: none; width: 100%; margin-top: 5px; padding: 8px;">
                        <option value="">拠点を選択</option>
                        <option value="町田">町田</option>
                        <option value="厚木">厚木</option>
                        <option value="相模原">相模原</option>
                        <option value="大和">大和</option>
                        <option value="工場">工場</option>
                        <option value="双葉">双葉</option>
                    </select>
                </div>
                <div class="modal-field-group">
                    <label>型式</label>
                    <input type="text" id="edit_machine_model">
                </div>
                <div class="modal-field-group">
                    <label>シリアル No</label>
                    <input type="text" id="edit_serial_number">
                </div>
            </div>

            <div class="modal-field-group">
                <label>現場住所</label>
                <input type="text" id="edit_location">
            </div>
            <div class="modal-field-group">
                <label>故障症状・メモ</label>
                <textarea id="edit_failure_symptoms" style="height: 60px;"></textarea>
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            <h4 style="margin: 0 0 10px 0;">✅ 修理完了報告</h4>
            
            <div class="modal-field-group">
                <label>故障原因カテゴリー</label>
                <div class="checkbox-group" id="modal-category-group">
                    <label><input type="checkbox" value="燃料系"> 燃料系</label>
                    <label><input type="checkbox" value="電気系"> 電気系</label>
                    <label><input type="checkbox" value="油圧系"> 油圧系</label>
                    <label><input type="checkbox" value="構造系"> 構造系</label>
                    <label><input type="checkbox" value="定期点検"> 定期点検</label>
                    <label><input type="checkbox" value="先方都合"> 先方都合</label>
                </div>
            </div>

            <div class="modal-field-group">
                <input type="text" id="worker_name" placeholder="作業者名">
            </div>
            <div class="modal-field-group">
                <textarea id="completion_notes" placeholder="交換部品や作業内容の備考" style="height: 60px;"></textarea>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button onclick="submitCompletion()" style="background-color: #28a745; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">内容を更新 / 完了として保存</button>
                <div style="display: flex; gap: 8px;">
                    <button id="delete-btn" onclick="deleteAppointment()" style="flex: 1; background-color: white; color: #d9534f; border: 1px solid #d9534f; padding: 10px; border-radius: 4px; cursor: pointer;">この予約を削除</button>
                    <button onclick="closeModal()" style="flex: 1; background-color: #6c757d; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">閉じる</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ページ読み込み時に実行
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('repair_user'));
            if (!user) {
                window.location.href = './login.html';
                return;
            }
            // ユーザー名を表示
            document.getElementById('display-user').textContent = user.username;
            if (user.is_admin) {
                document.getElementById('admin-badge').style.display = 'inline';
                if (document.getElementById('delete-btn')) {
                    document.getElementById('delete-btn').style.display = 'block';
                }
            } else {
                // 一般ユーザーは削除ボタンを非表示にする等の制御
                if (document.getElementById('delete-btn')) {
                    document.getElementById('delete-btn').style.display = 'none';
                }
            }
        });

        // ログアウト処理
        function handleLogout() {
            if (confirm('ログアウトしますか？')) {
                localStorage.removeItem('repair_user');
                window.location.href = './login.html';
            }
        }

        // 自社リースの拠点選択表示切り替え
        function toggleLeaseLocation(mode) {
            if (mode === 'new') {
                const isChecked = document.getElementById('is_own_lease').checked;
                document.getElementById('lease_location').style.display = isChecked ? 'inline-block' : 'none';
            } else {
                const isChecked = document.getElementById('edit_is_own_lease').checked;
                document.getElementById('edit_lease_location').style.display = isChecked ? 'block' : 'none';
            }
        }
    </script>
    <script src="./static/js/main.js"></script>
</body>
</html>
